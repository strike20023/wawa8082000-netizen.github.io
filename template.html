<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>{{PAGE_TITLE}}</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 18px;
            display: grid;
            place-items: center;
            text-align: center;
            font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #3f3925 url("../../background.jpg") center / cover fixed no-repeat;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(20, 16, 8, 0.62);
        }
        body > * { position: relative; z-index: 1; }
        #countdown {
            min-width: 4.5em;
            font-size: clamp(48px, 10vw, 80px);
            font-weight: 700;
            color: white;
            padding: 18px 28px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            background: rgba(17, 13, 7, 0.82);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            text-shadow: 0 2px 4px black;
        }
        #end-message {
            display: none;
            width: min(900px, 100%);
            color: white;
            padding: clamp(22px, 5vw, 44px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            background: rgba(17, 13, 7, 0.86);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            text-shadow: 0 2px 4px black;
        }
        .prompt {
            font-size: clamp(24px, 5vw, 40px);
            font-weight: 600;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }
        .media {
            display: grid;
            gap: 24px;
            margin-top: 28px;
        }
        figure { margin: 0; }
        img, video {
            display: block;
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.45);
        }
        audio { display: block; width: 100%; }
        .attachment a { color: #ffe8a3; font-size: 20px; }
    </style>
</head>
<body>
    <div id="countdown" role="timer" aria-live="polite">{{COUNTDOWN_LABEL}}</div>
    <main id="end-message">
        {{PROMPT_HTML}}
        {{MEDIA_HTML}}
    </main>

    <script>
        let time = {{COUNTDOWN_SECONDS}};
        const countdown = document.getElementById("countdown");
        const message = document.getElementById("end-message");

        function update() {
            const min = Math.floor(time / 60).toString().padStart(2, "0");
            const sec = (time % 60).toString().padStart(2, "0");
            countdown.textContent = `${min}:${sec}`;
            if (time-- <= 0) {
                countdown.style.display = "none";
                message.style.display = "block";
                clearInterval(timer);
            }
        }

        update();
        const timer = setInterval(update, 1000);
    </script>
</body>
</html>
